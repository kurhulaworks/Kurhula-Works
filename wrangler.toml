name = "kurhula-works-worker"
compatibility_date = "2026-01-01"
main = "worker/index.js"

# Replace the following placeholders with your Cloudflare account-specific values before deployment.
# - account_id: your Cloudflare account ID
# - d1 database "database_name": the D1 database name
# - r2 bucket "bucket_name": the R2 bucket name

account_id = "YOUR_ACCOUNT_ID"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "KURHULA_D1"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "KURHULA_IMAGES"
