<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kurhula Works</title>
  <style>
    body{font-family: Arial, sans-serif; margin:0; padding:0}
    header{background:#333;color:#fff;padding:1rem}
    .section{padding:1rem}
    .gallery img{max-width:200px;margin:0.5rem}
    form{max-width:600px}
    label{display:block;margin-top:0.5rem}
  </style>
</head>
<body>
  <header><h1>Kurhula Works</h1></header>
  <main>
    <div id="sections"></div>
    <section class="section">
      <h2>Contact / Enquiry</h2>
      <form id="contactForm">
        <label>Name <input name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Phone <input name="phone"></label>
        <label>Message <textarea name="message" required></textarea></label>
        <button type="submit">Send</button>
      </form>
      <div id="contactResult"></div>
    </section>
  </main>

  <script>
    async function loadSections(){
      const res = await fetch('/api/sections');
      const sections = await res.json();
      const container = document.getElementById('sections');
      container.innerHTML = '';
      for(const s of sections){
        const el = document.createElement('section');
        el.className = 'section';
        el.innerHTML = `<h2>${s.name}</h2><div class="gallery" id="gallery-${s.slug}">Loading...</div>`;
        container.appendChild(el);
        loadImagesForSection(s.slug);
      }
    }
    async function loadImagesForSection(slug){
      const res = await fetch('/api/images?section='+encodeURIComponent(slug));
      const imgs = await res.json();
      const g = document.getElementById('gallery-'+slug);
      g.innerHTML = '';
      if(!imgs.length) g.textContent = 'No images yet.';
      for(const i of imgs){
        const img = document.createElement('img');
        img.src = i.url;
        img.alt = i.filename;
        g.appendChild(img);
      }
    }
    document.getElementById('contactForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      const res = await fetch('/api/enquiries', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
      if(res.ok) document.getElementById('contactResult').textContent = 'Sent. Thank you!';
      else document.getElementById('contactResult').textContent = 'Error sending.';
      e.target.reset();
    });
    loadSections();
  </script>
</body>
</html>
