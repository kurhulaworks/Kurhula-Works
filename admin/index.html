<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Kurhula Works</title>
  <!-- API base: set to "/api" to use the same origin (recommended if you route /api/* to the Worker),
       or set to your Worker URL like "https://<your-worker-subdomain>.workers.dev" if you deploy the Worker separately.
  -->
  <meta name="api-base" content="/api">
  <style>
    body{font-family:Arial, sans-serif;padding:1rem}
    .hidden{display:none}
    nav a{margin-right:1rem}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #ccc;padding:0.5rem}
  </style>
</head>
<body>
  <h1>Kurhula Works - Admin</h1>
  <div id="login">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Username <input name="username" required></label>
      <label>Password <input name="password" type="password" required></label>
      <button>Login</button>
    </form>
    <div id="loginResult"></div>
  </div>
  <div id="app" class="hidden">
    <nav>
      <a href="#" id="navDashboard">Dashboard</a>
      <a href="#" id="navImages">Website Images</a>
      <a href="#" id="navEnquiries">Messages / Enquiries</a>
      <a href="#" id="navLogout">Logout</a>
    </nav>
    <section id="dashboard" class="panel">
      <h2>Dashboard</h2>
      <div id="dashContent">Welcome.</div>
    </section>
    <section id="imagesPanel" class="panel hidden">
      <h2>Website Images</h2>
      <form id="uploadForm">
        <label>Section
          <select name="section" id="sectionSelect"></select>
        </label>
        <label>File <input type="file" name="file" accept="image/*" required></label>
        <button type="submit">Upload</button>
      </form>
      <div id="imagesList"></div>
    </section>
    <section id="enquiriesPanel" class="panel hidden">
      <h2>Enquiries</h2>
      <div id="enquiriesList">Loading...</div>
    </section>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginResult = document.getElementById('loginResult');
    const loginDiv = document.getElementById('login');
    const appDiv = document.getElementById('app');
    const tokenKey = 'kw_admin_token';
    const API_BASE = (document.querySelector('meta[name="api-base"]')||{content:'/api'}).content.replace(/\/$/, '');

    function setToken(t){ localStorage.setItem(tokenKey, t); }
    function getToken(){ return localStorage.getItem(tokenKey); }
    function authHeaders(){ const t=getToken(); return t?{ 'Authorization': 'Bearer '+t }:{}};

    loginForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = { username: fd.get('username'), password: fd.get('password') };
      try{
        const res = await fetch(API_BASE + '/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        if(res.ok){ const j=await res.json(); setToken(j.token); loginDiv.classList.add('hidden'); appDiv.classList.remove('hidden'); loadDashboard(); } else { const text = await res.text(); loginResult.textContent = 'Login failed: ' + text; }
      }catch(err){ loginResult.textContent = 'Login failed (network): ' + err.message; }
    });

    document.getElementById('navDashboard').addEventListener('click', ()=>showPanel('dashboard'));
    document.getElementById('navImages').addEventListener('click', ()=>showPanel('imagesPanel'));
    document.getElementById('navEnquiries').addEventListener('click', ()=>showPanel('enquiriesPanel'));
    document.getElementById('navLogout').addEventListener('click', async ()=>{ await fetch(API_BASE + '/admin/logout', { method:'POST', headers: authHeaders() }); localStorage.removeItem(tokenKey); location.reload(); });

    function showPanel(id){ document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); if(id==='imagesPanel') loadImages(); if(id==='enquiriesPanel') loadEnquiries(); }

    async function loadDashboard(){ document.getElementById('dashContent').textContent = 'Loading...'; const res = await fetch(API_BASE + '/sections'); const s = await res.json(); document.getElementById('dashContent').textContent = 'Sections: ' + s.map(x=>x.name).join(', '); }

    async function loadSectionsIntoSelect(){ const res = await fetch(API_BASE + '/sections'); const s = await res.json(); const sel = document.getElementById('sectionSelect'); sel.innerHTML=''; s.forEach(x=>{ const o=document.createElement('option'); o.value=x.slug; o.textContent=x.name; sel.appendChild(o); }); }

    document.getElementById('uploadForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const res = await fetch(API_BASE + '/images/upload', { method:'POST', headers: authHeaders(), body: fd });
      if(res.ok){ alert('Uploaded'); loadImages(); } else { alert('Upload failed: ' + await res.text()); }
    });

    async function loadImages(){ await loadSectionsIntoSelect(); const res = await fetch(API_BASE + '/images?section='+encodeURIComponent(document.getElementById('sectionSelect').value)); const imgs = await res.json(); const list = document.getElementById('imagesList'); list.innerHTML=''; if(!imgs.length) list.textContent='No images'; imgs.forEach(i=>{
      const div = document.createElement('div');
      div.innerHTML = `<img src="${i.url}" style="max-width:150px"><br>${i.filename} <button data-id="${i.id}">Delete</button>`;
      list.appendChild(div);
    });
    document.querySelectorAll('#imagesList button').forEach(b=>b.addEventListener('click', async (ev)=>{
      const id = ev.target.getAttribute('data-id'); if(!confirm('Delete?')) return; const res = await fetch(API_BASE + '/images/'+id, { method:'DELETE', headers: authHeaders() }); if(res.ok){ alert('Deleted'); loadImages(); } else alert('Delete failed'); }));
    }

    async function loadEnquiries(){ const res = await fetch(API_BASE + '/enquiries', { headers: authHeaders() }); if(!res.ok){ document.getElementById('enquiriesList').textContent = 'Error or unauthorized'; return; } const en = await res.json(); const el = document.getElementById('enquiriesList'); el.innerHTML=''; if(!en.length) el.textContent = 'No enquiries'; en.forEach(q=>{
      const d = document.createElement('div'); d.innerHTML = `<strong>${q.name}</strong> (${q.email} / ${q.phone}) <em>${q.created_at}</em><p>${q.message}</p><hr>`; el.appendChild(d);
    }); }

    // Auto-login if token present
    if(getToken()){ loginDiv.classList.add('hidden'); appDiv.classList.remove('hidden'); loadDashboard(); }
  </script>
</body>
</html>
