<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Request a Quote | Kurhula Works</title>

  <meta
    name="description"
    content="Request a construction or renovation quote from Kurhula Works."
  >

  <link rel="stylesheet" href="css/style.css">

</head>


<body>


  <!-- HEADER -->

  <header class="site-header">

    <div class="container">

      <a
        href="index.html"
        class="logo"
      >

        <img
          src="assets/logo.png"
          alt="Kurhula Works"
          class="logo-image"
        >

        <span class="logo-name">
          Kurhula Works
        </span>

      </a>


      <nav class="main-nav">

        <a href="index.html">
          Home
        </a>

        <a href="index.html#services">
          Services
        </a>

        <a href="index.html#projects">
          Projects
        </a>

        <a href="index.html#about">
          About
        </a>

        <a href="index.html#contact">
          Contact
        </a>

      </nav>

    </div>

  </header>


  <!-- MAIN -->

  <main>


    <section class="section">

      <div class="container">


        <p class="eyebrow">
          Get started
        </p>


        <h1>
          Request a Quote
        </h1>


        <p class="section-intro">
          Tell us about your project and we'll
          get back to you to discuss the details.
        </p>


        <!-- ENQUIRY FORM -->

        <form
          class="quote-form"
          action="#"
          method="post"
        >


          <div class="form-group">

            <label for="name">
              Your name
            </label>

            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              required
            >

          </div>


          <div class="form-group">

            <label for="phone">
              WhatsApp / Phone number
            </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              autocomplete="tel"
              required
            >

          </div>


          <div class="form-group">

            <label for="email">
              Email address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
            >

          </div>


          <div class="form-group">

            <label for="service">
              Service
            </label>

            <select
              id="service"
              name="service"
              required
            >

              <option value="">
                Select a service
              </option>

              <option value="building-houses">
                Building Houses
              </option>

              <option value="renovations">
                Renovations
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="message">
              Tell us about your project
            </label>

            <textarea
              id="message"
              name="message"
              rows="7"
              placeholder="Tell us what you would like us to build or renovate..."
              required
            ></textarea>

          </div>


          <button
            type="submit"
            class="button button-primary"
          >
            Send Enquiry
          </button>


        </form>


        <p class="form-note">
          Prefer WhatsApp? You can also chat with us
          using the WhatsApp button.
        </p>


      </div>

    </section>


  </main>


  <!-- FOOTER -->

  <footer class="site-footer">

    <div class="container">

      <p>
        © 2026 Kurhula Works.
        All rights reserved.
      </p>

    </div>

  </footer>


</body>

</html>
