<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | Kurhula Works</title>

  <meta
    name="description"
    content="Kurhula Works administration login."
  >

  <link rel="stylesheet" href="admin.css">

</head>


<body>


  <header class="admin-header">

    <div class="admin-container">

      <div class="admin-brand">

        <span class="admin-brand-name">
          Kurhula Works
        </span>

        <span class="admin-label">
          Admin
        </span>

      </div>

    </div>

  </header>


  <main class="admin-main">

    <div class="admin-container">


      <section class="admin-welcome">

        <p class="eyebrow">
          Secure Access
        </p>

        <h1>
          Admin Login
        </h1>

        <p>
          Sign in to manage the Kurhula Works website.
        </p>

      </section>


      <section class="admin-card login-card">

        <form id="login-form">

          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >

          </div>


          <button
            type="submit"
            class="admin-button"
          >
            Sign in
          </button>


          <p
            id="login-message"
            role="alert"
          ></p>

        </form>

      </section>


    </div>

  </main>


  <script src="login.js"></script>

</body>

    </html>
